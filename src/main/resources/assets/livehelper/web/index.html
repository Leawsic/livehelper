<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>LiveHelper</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>LiveHelper</h1>
        <nav>
            <button data-tab="overview" class="active">总览</button>
            <button data-tab="clips">Clips</button>
            <button data-tab="managers">Managers</button>
        </nav>
    </header>

    <main>
        <section id="overview" class="tab active">
            <h2>总览</h2>
            <button id="refresh-overview">刷新</button>
            <div id="overview-content"></div>
        </section>

        <section id="clips" class="tab">
            <h2>Clips</h2>
            <button id="new-clip">新建 Clip</button>
            <div id="clips-list"></div>
        </section>

        <section id="managers" class="tab">
            <h2>Managers</h2>
            <button id="new-manager">新建 Manager</button>
            <div id="managers-list"></div>
        </section>
    </main>

    <dialog id="editor-dialog">
        <form method="dialog" id="editor-form">
            <h3 id="editor-title"></h3>
            <div id="editor-fields"></div>
            <menu>
                <button value="cancel">取消</button>
                <button id="editor-save" value="default">保存</button>
            </menu>
        </form>
    </dialog>

    <script src="app.js"></script>
</body>
</html>
