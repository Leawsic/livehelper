<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>LiveHelper</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="app-header">
        <div>
            <p class="eyebrow">Minecraft Multi-Camera Spout Control</p>
            <h1>LiveHelper</h1>
        </div>
        <nav class="tabs">
            <button data-tab="overview" class="active">总览</button>
            <button data-tab="clips">Clips</button>
            <button data-tab="managers">Managers</button>
        </nav>
    </header>

    <main>
        <section id="overview" class="tab active">
            <div class="section-head">
                <div>
                    <p class="eyebrow">Overview</p>
                    <h2>推流总览</h2>
                </div>
                <button id="refresh-overview" class="primary">刷新</button>
            </div>
            <div id="overview-content" class="grid"></div>
        </section>

        <section id="clips" class="tab">
            <div class="section-head">
                <div>
                    <p class="eyebrow">Camera Motion</p>
                    <h2>Clips</h2>
                </div>
                <button id="new-clip" class="primary">新建 Clip</button>
            </div>
            <div id="clips-list" class="grid"></div>
        </section>

        <section id="managers" class="tab">
            <div class="section-head">
                <div>
                    <p class="eyebrow">Timeline</p>
                    <h2>Managers</h2>
                </div>
                <button id="new-manager" class="primary">新建 Manager</button>
            </div>
            <div id="managers-list" class="grid"></div>
        </section>
    </main>

    <dialog id="editor-dialog">
        <form method="dialog" id="editor-form">
            <div class="dialog-head">
                <h3 id="editor-title"></h3>
                <button type="button" class="ghost" id="editor-close">关闭</button>
            </div>
            <div id="editor-fields"></div>
            <menu>
                <button type="button" class="ghost" id="editor-cancel">取消</button>
                <button type="button" id="editor-save" class="primary">保存</button>
            </menu>
        </form>
    </dialog>

    <div id="toast-root"></div>
    <script src="app.js"></script>
</body>
</html>
